[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mdhtml2docx"
dynamic = ["version"]
description = "Convert MDHTML to Word docx files"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Jeremy Howard", email = "j@fast.ai" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

dependencies = ["mdhtml>=0.1.43", "oxml>=0.1.4"]

[project.optional-dependencies]
dev = [
  "lxml",
  "pytest",
  "fastship",
  "build",
  "twine",
]

[project.urls]
Homepage = "https://github.com/AnswerDotAI/mdhtml2docx"

[tool.setuptools.dynamic]
version = { attr = "mdhtml2docx.__version__" }

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["mdhtml2docx"]

[tool.setuptools.package-data]
mdhtml2docx = ["templates/*"]
